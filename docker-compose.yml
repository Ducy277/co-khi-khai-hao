services:
  postgres:
    image: postgres:16-alpine
    container_name: ckkh_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ckkh
      POSTGRES_USER: ckkh_user
      POSTGRES_PASSWORD: ckkh_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
