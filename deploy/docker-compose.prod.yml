# docker-compose dành riêng cho production (AWS EC2)
# Chạy: docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.production up -d --build

services:

  # ── PostgreSQL Database ────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: ckkh_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ckkh_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Prisma Migrations (chạy 1 lần rồi thoát) ─────────────────────────────
  migrate:
    build:
      context: ..
      dockerfile: Dockerfile
    command: npx prisma migrate deploy
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ckkh_net
    restart: on-failure

  # ── Next.js Application ────────────────────────────────────────────────────
  web:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: ckkh_web
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXT_PUBLIC_SITE_NAME: ${NEXT_PUBLIC_SITE_NAME}
      NEXT_PUBLIC_PHONE: ${NEXT_PUBLIC_PHONE}
      NEXT_PUBLIC_ZALO: ${NEXT_PUBLIC_ZALO}
      NEXT_PUBLIC_EMAIL: ${NEXT_PUBLIC_EMAIL}
      NEXT_PUBLIC_ADDRESS: ${NEXT_PUBLIC_ADDRESS}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      UPLOAD_DIR: ${UPLOAD_DIR}
      NEXT_PUBLIC_UPLOAD_URL: ${NEXT_PUBLIC_UPLOAD_URL}
    volumes:
      - uploads_data:/app/public/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - ckkh_net

  # ── Nginx Reverse Proxy ────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: ckkh_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    networks:
      - ckkh_net

# ── Volumes ────────────────────────────────────────────────────────────────────
volumes:
  postgres_data:     # Dữ liệu PostgreSQL (persistent)
  uploads_data:      # Ảnh upload của sản phẩm (persistent)

# ── Networks ───────────────────────────────────────────────────────────────────
networks:
  ckkh_net:
    driver: bridge
